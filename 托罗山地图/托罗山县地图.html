<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>托罗山县行政区划图 · 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 26 L12 10 L18 20 L22 14 L28 26 Z' fill='%235a7a5a'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #e8e6dc; }

  #map-wrap { position: absolute; inset: 0; overflow: hidden; cursor: grab;
    touch-action: none;              /* 关键：把触摸手势交给脚本，别让浏览器拿去滚页面 */
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  #map-wrap.grabbing { cursor: grabbing; }
  #map-svg { width: 100%; height: 100%; display: block; transform-origin: 0 0; }

  /* ===== 顶部标题（克制） ===== */
  #topbar {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.92); border-bottom: 2px solid #5a7a5a;
    padding: 10px 28px 8px; z-index: 10; text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  #topbar h1 { font-size: 17px; font-weight: 600; color: #2b3a2b; letter-spacing: 6px; }
  #topbar .sub { font-size: 10px; color: #888; margin-top: 3px; letter-spacing: 2px; }

  /* ===== 左侧图例/图层 ===== */
  #panel {
    position: absolute; top: 80px; left: 16px; width: 200px;
    background: rgba(255,255,255,0.94); border: 1px solid #ddd8c8;
    border-radius: 4px; padding: 12px 14px; z-index: 10;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    max-height: calc(100vh - 120px); overflow-y: auto;
    font-size: 12px;
  }
  #panel h2 { font-size: 11px; color: #555; margin: 8px 0 6px; padding-bottom: 4px;
    border-bottom: 1px solid #eee; letter-spacing: 2px; }
  #panel h2:first-child { margin-top: 0; }
  .legend-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; color: #555; cursor: pointer; }
  .legend-row input { cursor: pointer; }
  .swatch { width: 14px; height: 10px; border-radius: 1px; display: inline-block; border: 1px solid rgba(0,0,0,0.1); }

  /* ===== 右侧详情 ===== */
  #detail {
    position: absolute; top: 80px; right: 16px; width: 290px;
    background: rgba(255,255,255,0.97); border: 1px solid #ddd8c8;
    border-radius: 4px; padding: 18px 20px; z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    display: none; max-height: calc(100vh - 120px); overflow-y: auto;
  }
  #detail.show { display: block; }
  #detail .close { position: absolute; top: 6px; right: 12px; cursor: pointer; color: #aaa; font-size: 20px; }
  #detail h3 { font-size: 15px; color: #2b3a2b; margin-bottom: 6px; font-weight: 600; padding-right: 20px; }
  #detail .cat { display: inline-block; font-size: 10px; color: #5a7a5a; background: #e8efe4;
    padding: 2px 8px; border-radius: 2px; margin-bottom: 10px; letter-spacing: 1px; }
  #detail p { font-size: 12px; color: #555; line-height: 1.8; }
  #detail .meta { margin-top: 12px; padding-top: 8px; border-top: 1px dashed #ddd;
    font-size: 11px; color: #888; line-height: 1.7; }

  /* ===== 控制按钮 ===== */
  #controls { position: absolute; top: 80px; right: 16px; z-index: 9; display: flex; flex-direction: column; gap: 4px; }
  .ctrl-btn {
    width: 32px; height: 32px; background: rgba(255,255,255,0.95);
    border: 1px solid #ccc; cursor: pointer; color: #555; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl-btn:hover { background: #f5f5f5; }

  /* ===== 比例尺/指北针/版权 ===== */
  #scale-bar { position: absolute; bottom: 24px; left: 16px; z-index: 10;
    background: rgba(255,255,255,0.9); padding: 5px 10px; font-size: 10px; color: #666;
    border: 1px solid #ccc; }
  #north-arrow { position: absolute; bottom: 70px; left: 28px; z-index: 10;
    width: 36px; height: 36px; background: rgba(255,255,255,0.9);
    border: 1px solid #ccc; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #333; font-weight: bold; }
  #copyright { position: absolute; bottom: 4px; right: 8px; z-index: 10;
    font-size: 10px; color: #999; background: rgba(255,255,255,0.7); padding: 2px 6px; }

  /* ===== SVG 元素分层 ===== */
  .land { fill: #f5f2e8; }
  .mountain { fill: #d8e4cc; }
  .water { fill: #b8d0dc; }
  .water-line { fill: none; stroke: #9ec0d0; stroke-width: 3; }
  .builtup { fill: #e8e2d0; }
  .zone { opacity: 0; }
  .zone-boundary { fill: none; stroke: #b0a890; stroke-width: 0.8; stroke-dasharray: 4 3; opacity: 0; }

  .road-edge { fill: none; stroke: #d0c8b0; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
  .road-main { fill: none; stroke: #ffffff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .road-edge-minor { fill: none; stroke: #d6cfba; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .road-minor { fill: none; stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }

  /* 地名层级 */
  .place-county { font-size: 22px; font-weight: 600; fill: #5a5a5a; letter-spacing: 8px;
    font-family: "Source Han Serif SC", "SimSun", serif; }
  .place-mountain { font-size: 18px; font-weight: 500; fill: #7a9a6a; letter-spacing: 6px;
    font-family: "Source Han Serif SC", "SimSun", serif; }
  .zone-label { font-size: 13px; fill: #8a8578; letter-spacing: 3px; font-weight: 500; }
  .village-label { font-size: 11px; fill: #6f6a5c; letter-spacing: 1px; }
  .lake-label { font-size: 15px; fill: #6a9aae; letter-spacing: 4px;
    font-family: "Source Han Serif SC", "SimSun", serif; }
  .road-label { font-size: 10px; fill: #8d8d8d; font-family: inherit; }
  .road-label-on { fill: #fff; font-size: 9.5px; font-weight: 600;
    paint-order: stroke; stroke: #c8bfa6; stroke-width: 2px; }

  /* POI */
  .poi { cursor: pointer; }
  .poi-dot { stroke: #fff; stroke-width: 1.5; }
  .poi-label { font-size: 10.5px; fill: #444; font-weight: 500;
    paint-order: stroke; stroke: rgba(255,255,255,0.85); stroke-width: 2.5px; }
  .poi:hover .poi-dot { stroke-width: 2.5; }
  /* 关键地名：任何缩放级别都显示（手机缩到最小时也有参照物） */
  .poi-key .poi-dot { r: 6.5; }
  .poi-key .poi-label { font-size: 12px; fill: #2b3a2b; font-weight: 700;
    stroke-width: 3px; }

  /* LOD 控制类 */
  .lod-min { display: none; }
  .lod-mid { display: none; }
  .lod-max { display: none; }
  body[data-lod="min"] .lod-min { display: inline; }
  body[data-lod="min"] .lod-min-g { display: inline; }
  body[data-lod="mid"] .lod-min, body[data-lod="mid"] .lod-mid { display: inline; }
  body[data-lod="mid"] .lod-mid-g, body[data-lod="mid"] .lod-min-g { display: inline; }
  body[data-lod="max"] .lod-min, body[data-lod="max"] .lod-mid, body[data-lod="max"] .lod-max { display: inline; }
  body[data-lod="max"] .lod-max-g, body[data-lod="max"] .lod-mid-g, body[data-lod="max"] .lod-min-g { display: inline; }
  /* g 元素用 inline 替换 block */
  g.lod-min-g, g.lod-mid-g, g.lod-max-g { display: none; }
  body[data-lod="min"] g.lod-min-g { display: inline; }
  body[data-lod="mid"] g.lod-min-g, body[data-lod="mid"] g.lod-mid-g { display: inline; }
  body[data-lod="max"] g.lod-min-g, body[data-lod="max"] g.lod-mid-g, body[data-lod="max"] g.lod-max-g { display: inline; }
  text.lod-min, text.lod-mid, text.lod-max { display: none; }
  body[data-lod="min"] text.lod-min { display: inline; }
  body[data-lod="mid"] text.lod-min, body[data-lod="mid"] text.lod-mid { display: inline; }
  body[data-lod="max"] text.lod-min, body[data-lod="max"] text.lod-mid, body[data-lod="max"] text.lod-max { display: inline; }

  /* 关键地名：三级都显示 */
  g.lod-always-g { display: inline !important; }
  text.lod-always { display: inline !important; }

  /* ===== 面板折叠（手机用） ===== */
  .panel-fold { display: none; }
  #panel .panel-body { display: block; }

  /* ===== 窄屏 / 矮屏适配：手指能按、面板不挡图 ===== */
  @media (max-width: 760px), (max-height: 520px) {
    #topbar { top: 8px; padding: 7px 14px 6px; max-width: calc(100vw - 24px); }
    #topbar h1 { font-size: 14px; letter-spacing: 3px; }
    #topbar .sub { font-size: 9px; letter-spacing: 1px; }

    #panel {
      top: 66px; left: 8px; width: auto; max-width: 132px;
      padding: 8px 10px; font-size: 12px;
      max-height: calc(100vh - 150px);
    }
    .legend-row { padding: 5px 0; }      /* 手指点得中 */
    .legend-row input { width: 15px; height: 15px; }
    .swatch { width: 12px; height: 8px; }

    #controls { top: 66px; right: 8px; }
    .ctrl-btn { width: 42px; height: 42px; font-size: 20px; }

    #detail {
      top: auto; left: 8px; right: 8px; width: auto; max-width: none;
      bottom: 12px; max-height: 44vh; padding: 14px 16px;
      box-shadow: 0 -2px 16px rgba(0,0,0,0.18);
    }
    #detail .close { font-size: 26px; top: 4px; right: 14px; padding: 4px 6px; }

    #north-arrow { bottom: 62px; left: 12px; width: 32px; height: 32px; font-size: 12px; }
    #scale-bar { bottom: 20px; left: 12px; font-size: 9px; padding: 4px 7px; }
    #copyright { font-size: 8px; padding: 2px 4px; }
  }

  /* 横屏手机：面板压扁一点 */
  @media (max-height: 480px) {
    #panel { max-height: calc(100vh - 90px); top: 54px; }
    #topbar { top: 6px; padding: 5px 12px 4px; }
    #topbar h1 { font-size: 13px; }
    #detail { max-height: 62vh; }
  }
</style>

// ============================================================
// 缩放 / 拖拽 / 触摸
// ------------------------------------------------------------
// 做法：**不改 SVG 元素的 CSS transform，直接改 viewBox。**
//   viewBox = (vx, vy, vw, vh)，屏幕上 #map-wrap 尺寸是 (W, H)。
//   于是 svg 元素上设 preserveAspectRatio="none"，viewBox 正好铺满整个 wrap：
//       屏幕x = (图x - vx) / vw * W        图x = vx + 屏幕x / W * vw
//       屏幕y = (图y - vy) / vh * H        图y = vy + 屏幕y / H * vh
//   一条线性换算，没有中间层，不会错位。
//
//   之所以不用「CSS transform: scale() 缩放 svg 元素」：那会跟 SVG 自己的
//   preserveAspectRatio 叠加，内容基准缩放和外面的 scale 不是一个坐标系，
//   量出来的"图占多少像素"和算出来的对不上（之前就栽在这儿）。
//
// 起手视图 = 铺满视口 + 对准县城中心；vw/vh 里至少有一个顶到 MAP_W/MAP_H，
// 所以永远不会出现"图比视口小、留一片底色"的情况。
// ============================================================
const wrap = document.getElementById("map-wrap");
const svg = document.getElementById("map-svg");
const MAP_W = 1600, MAP_H = 1200;        // 地图内容尺寸（原来就是 viewBox 的宽高）
const FOCUS = { x: 700, y: 540 };        // 县城中心（县政府一带），起手对准这里
const MIN_VB = 150;                      // 最多放大到只看 150 单位宽（约 1/10 幅，够看街口）
const MAX_VB = MAP_W;                    // 最多缩到整幅宽

let vb = { x: 0, y: 0, w: MAP_W, h: MAP_H };

function inBox(el, sel) {
  const box = wrap.querySelector(sel) || document.querySelector(sel);
  while (el) { if (el === box) return true; el = el.parentNode; }
  return false;
}

function boxSize() {
  const r = wrap.getBoundingClientRect();
  return { W: r.width || wrap.clientWidth || window.innerWidth,
           H: r.height || wrap.clientHeight || window.innerHeight };
}

// viewBox 宽高比必须跟屏幕一致，否则 preserveAspectRatio="none" 会把圆压成椭圆
function ratio() {
  const { W, H } = boxSize();
  return (H > 0 && W > 0) ? W / H : 4 / 3;
}

function apply() {
  svg.setAttribute("viewBox", `${vb.x.toFixed(2)} ${vb.y.toFixed(2)} ${vb.w.toFixed(2)} ${vb.h.toFixed(2)}`);
  updateLOD();
  positionDetail();
}

// 限制 viewBox：宽度在 [MIN_VB, MAP_W]，并且至少有一个方向顶满地图
function clampView() {
  const r = ratio();
  vb.w = Math.min(MAX_VB, Math.max(MIN_VB, vb.w));
  vb.h = vb.w / r;
  if (vb.h > MAP_H) {                    // 比地图还高 → 改成高度顶满
    vb.h = MAP_H;
    vb.w = vb.h * r;
  }
  if (vb.w > MAP_W) {
    vb.w = MAP_W;
    vb.h = vb.w / r;
  }
  vb.x = Math.min(MAP_W - vb.w, Math.max(0, vb.x));
  vb.y = Math.min(MAP_H - vb.h, Math.max(0, vb.y));
  // 屏幕比地图还"高瘦"时上面的夹取会让 y 区间翻转，这里兜一下
  if (vb.x > MAP_W - vb.w) vb.x = MAP_W - vb.w;
  if (vb.y > MAP_H - vb.h) vb.y = MAP_H - vb.h;
  if (vb.x < 0) vb.x = 0;
  if (vb.y < 0) vb.y = 0;
}

// LOD：判据是「当前 viewBox 宽占整幅地图的比例」——跟屏幕像素无关，
// 所以同一块地方在手机和桌面上看到的细节层级一致。
//   占 3/4 以上（≥1200）→ min  只见整县轮廓、县名、山名、大水域 + 关键地名
//   占 3/4 ~ 1/3        → mid  城区轮廓、主要街道、政府/医院/车站/大桥
//   占 1/3 以下（<500） → max  近景，全部小店、路名、次干道
function updateLOD() {
  let lod;
  if (vb.w >= 1200) lod = "min";
  else if (vb.w >= 480) lod = "mid";
  else lod = "max";
  document.body.dataset.lod = lod;
}

// 把"想看到图上多大一块"(wantW × wantH) 转成合法的 viewBox，并尽量满足。
// 要点：屏幕是横长条就看不下 16:12 的整幅图（硬塞会缩小 scale、留白），
// 所以按屏幕比例把 viewBox 撑到"至少覆盖 want"，再在地图范围内夹紧。
function fitWant(wantW, wantH, fx, fy) {
  const r = ratio();
  let w = Math.max(wantW, wantH * r);    // 屏比图更宽 → 由高度要求反推宽度
  let h = w / r;
  if (h < wantH) { h = wantH; w = h * r; }
  if (w > MAP_W) { w = MAP_W; h = w / r; }
  if (h > MAP_H) { h = MAP_H; w = h * r; }
  vb.w = w; vb.h = h;
  vb.x = fx - w / 2;
  vb.y = fy - h / 2;
  clampView();
}

// 起手：
//   桌面 / 手机竖屏 → 能装下整幅就装下；手机竖屏屏幕窄，改成对准城区放大一块
//   手机横屏       → 屏幕扁，整幅装下时竖向刚好顶满，县城本来就在屏幕中间
function setInitialView() {
  const { W, H } = boxSize();
  if (W < 760 && H > W) {
    fitWant(440, 380, FOCUS.x, FOCUS.y);       // 手机竖屏：城区一块，细到看得清店铺
  } else {
    fitWant(MAP_W, MAP_H, MAP_W / 2, MAP_H / 2);
  }
  apply();
}
function resetView() { setInitialView(); }

// 详情面板：窄屏贴底，宽屏贴右上；不遮住它自己标出来的那个点
let detailAnchor = { x: FOCUS.x, y: FOCUS.y };
function positionDetail() {
  if (!detail.classList.contains("show")) return;
  const { W, H } = boxSize();
  if (W > 760) { detail.style.left = ""; detail.style.top = ""; return; }
  const r = ratio();
  const px = (detailAnchor.x - vb.x) / vb.w * W;
  const py = (detailAnchor.y - vb.y) / vb.h * H;
  const dw = detail.offsetWidth || 280;
  const left = Math.max(8, Math.min(W - dw - 8, px - dw / 2));
  const top = Math.min(Math.max(8, py - 24), Math.max(8, H - 180));
  detail.style.left = left + "px";
  detail.style.top = top + "px";
}

// ---------- 指针（鼠标 + 触屏 + 触控笔） ----------
const ptrs = new Map();
/* 每一指按下时的位置，用来区分"点击"和"拖动"（见 endPointer） */
const tapMove = new Map();
let mode = "none";                       // none | drag | pinch
let dragStart = null;
let pinchStart = null;

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

function localXY(e) {
  const r0 = wrap.getBoundingClientRect();
  return { x: e.clientX - r0.left, y: e.clientY - r0.top };
}

// 以屏幕点 (sx,sy) 为锚，把 viewBox 宽度设为 newW（锚点下的那个图点保持不动）
function zoomAtScreen(sx, sy, newW) {
  const { W, H } = boxSize();
  const r = ratio();
  const gx = vb.x + (sx / W) * vb.w;     // 锚点对应的图上坐标
  const gy = vb.y + (sy / H) * vb.h;
  let w = Math.min(MAX_VB, Math.max(MIN_VB, newW));
  let h = w / r;
  if (h > MAP_H) { h = MAP_H; w = h * r; }
  if (w > MAP_W) { w = MAP_W; h = w / r; }
  const fx = sx / W, fy = sy / H;        // 锚点在视口里的比例位置
  vb.w = w; vb.h = h;
  vb.x = gx - fx * w;
  vb.y = gy - fy * h;
  clampView();
  apply();
}

wrap.addEventListener("pointerdown", (e) => {
  if (inBox(e.target, "#panel") || inBox(e.target, "#detail") || inBox(e.target, ".ctrl-btn")) return;
  const p = localXY(e);
  ptrs.set(e.pointerId, p);
  tapMove.set(e.pointerId, { x: p.x, y: p.y, cx: e.clientX, cy: e.clientY, dist: 0 });
  wrap.classList.add("grabbing");
  if (ptrs.size === 1) {
    mode = "drag";
    dragStart = { p: p, x: vb.x, y: vb.y };
  } else if (ptrs.size === 2) {
    mode = "pinch";
    const [a, b] = [...ptrs.values()];
    pinchStart = { d: Math.max(dist(a, b), 1), w: vb.w, m: mid(a, b) };
  }
  if (wrap.setPointerCapture) { try { wrap.setPointerCapture(e.pointerId); } catch (_) {} }
  e.preventDefault();
});

wrap.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  const p = localXY(e);
  ptrs.set(e.pointerId, p);
  /* 记录这一指从按下到现在走了多远 —— 用来区分"点击"和"拖动" */
  const t = tapMove.get(e.pointerId);
  if (t) t.dist = Math.max(t.dist, Math.hypot(p.x - t.x, p.y - t.y));
  const { W, H } = boxSize();

  if (mode === "drag" && ptrs.size === 1 && dragStart) {
    // 屏幕位移换算成图上位移
    vb.x = dragStart.x - (p.x - dragStart.p.x) / W * vb.w;
    vb.y = dragStart.y - (p.y - dragStart.p.y) / H * vb.h;
    clampView();
    apply();
  } else if (mode === "pinch" && ptrs.size >= 2 && pinchStart) {
    const [a, b] = [...ptrs.values()];
    const m = mid(a, b);
    const newW = pinchStart.w * (pinchStart.d / Math.max(dist(a, b), 1));
    // 先把两指中点平移带来的位移算进去，再以中点为锚缩放
    const { W: W2 } = boxSize();
    const gx = vb.x + (m.x / W2) * vb.w;
    const gy = vb.y + (m.y / H) * vb.h;
    let w = Math.min(MAX_VB, Math.max(MIN_VB, newW));
    let h = w / ratio();
    if (h > MAP_H) { h = MAP_H; w = h * ratio(); }
    if (w > MAP_W) { w = MAP_W; h = w / ratio(); }
    vb.w = w; vb.h = h;
    vb.x = gx - (m.x / W2) * w;
    vb.y = gy - (m.y / H) * h;
    clampView();
    apply();
  }
  e.preventDefault();
});

function endPointer(e) {
  if (!ptrs.has(e.pointerId)) return;
  const wasSingle = ptrs.size === 1;
  const moved = tapMove.get(e.pointerId);
  ptrs.delete(e.pointerId);
  if (ptrs.size === 0) {
    mode = "none"; dragStart = null; pinchStart = null;
    wrap.classList.remove("grabbing");
    /* ------------------------------------------------------------
       点击判定放在这一层做
       ------------------------------------------------------------
       因为上面 pointerdown 里调了 setPointerCapture(pointerId)，
       指针被捕获到 wrap 上，POI 自己的 pointerup **永远不会触发**。
       （原来就是这么写的，结果点哪个 POI 都没反应。）
       所以在这里判：单指、位移小于 5px，就当点击，
       再用 elementFromPoint 找出底下是哪个 POI。
       ------------------------------------------------------------ */
    if (wasSingle && moved && moved.dist < 5) {
      /* ------------------------------------------------------------
         用 elementsFromPoint 而不是 elementFromPoint。
         ------------------------------------------------------------
         为什么：POI 的文字标签是**锚在点右边**的（text x="8"），
         所以左边那个 POI 的长标签会横着盖在右边这个 POI 的圆点上。
         elementFromPoint 只会给最上面那一个 —— 于是点在 A 的圆点上，
         命中的却是 B 的标签，弹出 B 的详情。
         这里把所有命中的元素都取出来，挑最靠后的那个圆点：
         点是点在圆点上的，圆点在 DOM 里就在它自己的标签前面。
         ------------------------------------------------------------ */
      let el = null;
      try { el = document.elementFromPoint(moved.cx, moved.cy); } catch (_) {}
      const hidden = el && el.closest ? el.closest("#detail, #panel, .ctrl-btn") : null;
      if (!hidden) {
        let hitPoi = null;
        let stack = [];
        try { stack = document.elementsFromPoint(moved.cx, moved.cy) || []; } catch (_) {}
        if (!stack.length && el) stack = [el];
        for (let i = stack.length - 1; i >= 0; i--) {
          const g = stack[i].closest ? stack[i].closest("#poi-layer g.poi") : null;
          if (g && stack[i].classList && stack[i].classList.contains("poi-dot")) { hitPoi = g; break; }
        }
        /* 只点到文字标签时，退一步找最近的那个圆点（容差按屏幕像素算） */
        if (!hitPoi) {
          const W = boxSize().W, H = boxSize().H;
          const tol = 22 / Math.max(W, 1) * vb.w;      // 22px 换算成图上距离
          let best = null, bestD = Infinity;
          POIS.forEach(p => {
            const g = poiLayer.querySelector('g.poi[data-id="' + p.id + '"]');
            if (!g) return;
            const gcs = getComputedStyle(g);
            if (gcs.display === "none" || +gcs.opacity < 0.05) return;
            const d = Math.hypot(p.x - (vb.x + moved.x / W * vb.w), p.y - (vb.y + moved.y / H * vb.h));
            if (d < bestD) { bestD = d; best = p; }
          });
          if (best && bestD <= tol) {
            const g = poiLayer.querySelector('g.poi[data-id="' + best.id + '"]');
            hitPoi = g;
          }
        }
        if (hitPoi) {
          const p = POI_BY_ID[hitPoi.dataset.id];
          if (p) openDetail(p);
        } else if (detail.classList.contains("show")) {
          /* 点空白处收起详情（点面板本身不收起） */
          detail.classList.remove("show");
        }
      }
    }
    tapMove.clear();
  } else if (ptrs.size === 1) {
    const p = [...ptrs.values()][0];     // 双指抬起一根 → 平滑接回单指拖动
    mode = "drag";
    dragStart = { p: p, x: vb.x, y: vb.y };
    pinchStart = null;
  }
}
wrap.addEventListener("pointerup", endPointer);
wrap.addEventListener("pointercancel", endPointer);
wrap.addEventListener("pointerleave", endPointer);

// 滚轮：以指针为锚点
wrap.addEventListener("wheel", (e) => {
  e.preventDefault();
  const p = localXY(e);
  zoomAtScreen(p.x, p.y, vb.w * (e.deltaY < 0 ? 1 / 1.15 : 1.15));
}, { passive: false });

// 双击：以双击点为锚放大
wrap.addEventListener("dblclick", (e) => {
  const p = localXY(e);
  zoomAtScreen(p.x, p.y, vb.w / 1.6);
});

// ---------- 按钮 ----------
function setZoom(factor) {
  const { W, H } = boxSize();
  zoomAtScreen(W / 2, H / 2, vb.w / factor);
}
document.getElementById("zoom-in").addEventListener("click", () => setZoom(1.3));
document.getElementById("zoom-out").addEventListener("click", () => setZoom(1 / 1.3));

// ---------- 视口变化（转屏 / 改窗口） ----------
// 按当前 viewBox 中心为锚重新铺满，保留用户所在的大致位置
function onViewportResize() {
  const { W, H } = boxSize();
  if (!W || !H) return;
  const r = ratio();
  const cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2;
  let w = vb.w, h = w / r;
  if (h > MAP_H) { h = MAP_H; w = h * r; }
  if (w > MAP_W) { w = MAP_W; h = w / r; }
  vb.w = w; vb.h = h;
  vb.x = cx - w / 2;
  vb.y = cy - h / 2;
  clampView();
  apply();
}
let rzTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(onViewportResize, 120);
});
window.addEventListener("orientationchange", () => {
  setTimeout(onViewportResize, 260);
  setTimeout(onViewportResize, 600);
});

// ---------- 点击空白关详情 ----------
// 注意：**不要再单独挂一个 click 处理来做这件事**。
// pointerdown 里调了 setPointerCapture，click 的 target 会变成 wrap 本身，
// 于是 inBox(e.target, "#detail") 永远为 false —— 详情刚打开就被这里立刻关掉，
// 表现就是"点哪个 POI 都没反应"。
// 现在统一由 endPointer 里那段处理（它用 elementFromPoint 拿真实目标）。

// ---------- 起手 ----------
setInitialView();
// 首帧量到的尺寸常是过渡值（地址栏、字体未就位），
// 在尺寸稳定前每帧重算一次；用户一旦操作就停手，不打断他。
let settled = 0, lastW = 0;
(function settle() {
  const { W, H } = boxSize();
  if (Math.abs(W - lastW) < 1 && ++settled > 2) return;
  lastW = W;
  setInitialView();
  if (settled < 40) requestAnimationFrame(settle);
})();

</script>
