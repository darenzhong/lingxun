<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="坨小政 正常态">
  <!-- 占位图：真正的形象图请放到同目录的 assistant-normal.jpg / .png，页面会自动优先使用 -->
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f0fb"/>
    </linearGradient>
    <linearGradient id="capG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C6BB5"/>
      <stop offset="1" stop-color="#1F4E9C"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#F4F8FD"/>

  <!-- 身体 -->
  <ellipse cx="256" cy="330" rx="132" ry="126" fill="url(#bodyG)" stroke="#1F4E9C" stroke-width="6"/>

  <!-- 机械臂 -->
  <rect x="86" y="322" width="52" height="26" rx="13" fill="#CBD9EE" stroke="#1F4E9C" stroke-width="5"/>
  <rect x="374" y="322" width="52" height="26" rx="13" fill="#CBD9EE" stroke="#1F4E9C" stroke-width="5"/>

  <!-- 胸前五角星 -->
  <path d="M256 352 l11 26 28 3 -21 19 6 28 -24 -14 -24 14 6 -28 -21 -19 28 -3 z"
        fill="#C7000B"/>

  <!-- 小册子 -->
  <rect x="300" y="392" width="74" height="54" rx="6" fill="#2C6BB5" stroke="#1F4E9C" stroke-width="5"/>
  <line x1="312" y1="410" x2="362" y2="410" stroke="#DCE6F5" stroke-width="4"/>
  <line x1="312" y1="424" x2="352" y2="424" stroke="#DCE6F5" stroke-width="4"/>

  <!-- 方帽 -->
  <rect x="176" y="130" width="160" height="96" rx="12" fill="url(#capG)" stroke="#16386F" stroke-width="6"/>
  <rect x="200" y="164" width="112" height="34" rx="6" fill="#16386F" opacity="0.35"/>

  <!-- 眼睛 -->
  <circle cx="216" cy="292" r="15" fill="#1A1A1A"/>
  <circle cx="296" cy="292" r="15" fill="#1A1A1A"/>
  <circle cx="221" cy="286" r="4.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="301" cy="286" r="4.5" fill="#ffffff" opacity="0.9"/>

  <!-- 微笑 -->
  <path d="M226 330 Q256 356 286 330" fill="none" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round"/>

  <!-- 腮红 -->
  <ellipse cx="184" cy="320" rx="18" ry="10" fill="#F2B8B8" opacity="0.55"/>
  <ellipse cx="328" cy="320" rx="18" ry="10" fill="#F2B8B8" opacity="0.55"/>
</svg>
