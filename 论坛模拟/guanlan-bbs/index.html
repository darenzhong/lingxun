<style>
/* ============================================================
   配色。想换主题色只改这里
   ============================================================ */
:root{
  --blue:#1e5aa8;
  --blue-deep:#14407c;
  --blue-soft:#e8f1fb;
  --line:#c9dcef;
  --bg:#f2f5fa;
  --text:#222;
  --muted:#8a97a8;
  --link:#1a5fb4;
  --board-w:180px;
  --side-w:220px;
  --wrap:1280px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SimSun","宋体","Songti SC",serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.7}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%}

.topbar{background:var(--blue);color:#fff}
.topbar-in{max-width:var(--wrap);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font-size:22px;font-weight:bold;letter-spacing:2px;flex-shrink:0}
.logo small{display:block;font-size:10px;font-weight:normal;opacity:.8;letter-spacing:1px}
.banner-slogan{flex:1;font-size:13px;opacity:.92;min-width:0}
.topbar-right a{color:#fff;margin-left:14px;font-size:13px;white-space:nowrap}

.nav{background:var(--blue-deep)}
.nav-in{max-width:var(--wrap);margin:0 auto;padding:0 20px;display:flex;flex-wrap:wrap}
.nav a{color:#eaf2fc;padding:9px 18px;display:block;font-size:14px;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.12);text-decoration:none}
.nav a.cur{background:#fff;color:var(--blue);font-weight:bold}

.wrap{max-width:var(--wrap);margin:16px auto;display:grid;grid-template-columns:var(--board-w) 1fr var(--side-w);gap:18px;padding:0 20px;align-items:start}

.left .box{background:#fff;border:1px solid var(--line);margin-bottom:12px}
.left .box h4{background:var(--blue-soft);color:var(--blue-deep);padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.boards{list-style:none}
.boards li a{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;color:var(--text);border-bottom:1px dashed #e6edf6;font-size:13px;cursor:pointer}
.boards li a:hover{background:var(--blue-soft);text-decoration:none;color:var(--blue-deep)}
.boards li a.cur{background:var(--blue-soft);color:var(--blue-deep);font-weight:bold}
.boards li a .cnt{color:var(--muted);font-size:12px;white-space:nowrap}
.boards li a .cnt b{color:#d9534f;font-weight:normal}

.card{background:#fff;border:1px solid var(--line);margin-bottom:14px}
.card>h3{background:var(--blue-soft);padding:8px 14px;font-size:14px;color:var(--blue-deep);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card>h3 .more{font-size:12px;font-weight:normal;color:var(--muted)}

.table-scroll{overflow-x:auto}
table.plist{width:100%;border-collapse:collapse;min-width:560px}
.plist th{background:#f6f9fd;color:#5a6b80;font-weight:normal;font-size:12px;padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
.plist td{padding:9px 10px;border-bottom:1px solid #edf2f8;font-size:13px;vertical-align:top}
.plist tr:hover td{background:#fafcff}
.plist .t{font-size:14px}
.plist .t .pin{color:#d9534f;margin-right:6px;font-weight:bold}
.plist .author{color:#3a7bd5;white-space:nowrap}
.plist .num{text-align:center;color:var(--muted)}
.plist .last{color:var(--muted);font-size:12px;white-space:nowrap}

.rank{list-style:none;counter-reset:r}
.rank li{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px dashed #eef3f9;font-size:13px}
.rank li::before{counter-increment:r;content:counter(r);width:20px;height:20px;line-height:20px;text-align:center;background:var(--blue-soft);color:var(--blue-deep);border-radius:3px;font-size:12px;flex-shrink:0}
.rank li:nth-child(-n+3)::before{background:var(--blue);color:#fff}

.ad-slot{margin:0 0 14px;text-align:center}
.ad-slot .ph{border:1px dashed var(--line);background:#fff;padding:14px;font-size:12px;color:var(--muted)}

.post-box{padding:20px 22px}
.post-box h1{font-size:21px;color:var(--blue-deep);margin-bottom:6px;line-height:1.4}
.post-meta{color:var(--muted);font-size:12px;border-bottom:1px solid #edf2f8;padding-bottom:10px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:4px 0}
.post-meta span{margin-right:14px}
.post-body p{margin-bottom:12px;text-indent:2em}
.post-body .tip{background:var(--blue-soft);border-left:3px solid var(--blue);padding:8px 12px;margin:10px 0;text-indent:0;font-size:13px}
.reply{border-top:1px dashed #e3ebf5;padding:10px 0}
.reply .rh{font-size:12px;color:var(--muted);margin-bottom:4px}
.reply .rh b{color:#3a7bd5}
.reply .floor{color:#b0bccc;margin-right:6px}

.mask{position:fixed;inset:0;background:rgba(10,25,50,.8);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out;padding:20px}
.mask.show{display:flex}
.err{background:#fff;width:380px;max-width:90vw;border:3px solid var(--blue);border-radius:6px;padding:30px;text-align:center}
.err .code{font-size:48px;color:var(--blue);font-weight:bold}
.err p{color:#666;margin:10px 0 18px}
.err button{background:var(--blue);color:#fff;border:none;padding:7px 22px;cursor:pointer;border-radius:3px}
#img-mask img{max-width:80vw;max-height:80vh;border:6px solid #fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#img-cap{position:fixed;bottom:20px;left:0;right:0;text-align:center;color:#cfd8e6;font-size:13px;padding:0 20px}

footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}

/* 停留 30 秒触发的一次闪屏：反色+轻微抖动，像信号抽风 */
body.flashing{animation:dwflash .55s steps(2,end)}
@keyframes dwflash{
  0%{filter:none;transform:none}
  25%{filter:invert(1) hue-rotate(80deg);transform:translate(3px,0)}
  50%{filter:none;transform:none}
  75%{filter:saturate(3) hue-rotate(-30deg);transform:translate(-3px,0)}
  100%{filter:none;transform:none}
}

/* ---------- 平板 ---------- */
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;gap:14px;padding:0 14px}
  .right{order:3}
  .left{order:2}
  .nav-in{padding:0 8px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .nav a{white-space:nowrap;padding:9px 13px;font-size:13px}
  .topbar-in{flex-wrap:wrap;gap:8px;padding:10px 14px}
  .banner-slogan{order:3;flex-basis:100%}
  /* 左版块变成一排横滑小标签 */
  .boards{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .boards li{flex-shrink:0}
  .boards li a{border-bottom:none;border-right:1px dashed #e6edf6;padding:8px 12px}
}
/* ---------- 手机 ---------- */
@media(max-width:560px){
  body{font-size:14px}
  .logo{font-size:18px}
  .topbar-right a{margin-left:10px;font-size:12px}
  .post-box{padding:14px}
  .post-box h1{font-size:18px}
  .plist .author{display:none}
  .plist th:nth-child(2),.plist td:nth-child(2){display:none}
  .err{padding:22px}
}
</style>

$("#logo").innerHTML = SITE.siteName + '<small>'+SITE.domain+'</small>';
$("#banner").textContent = SITE.banner;
$("#footer").textContent = SITE.footer;

const navEl=$("#nav");
SITE.nav.forEach((n,i)=>{
  const a=document.createElement("a");
  a.textContent=n; if(i===0)a.className="cur";
  a.dataset.name=n;
  a.onclick=e=>{e.preventDefault();applyBoard(n==="首页"?null:n);};
  navEl.appendChild(a);
});

const bl=$("#board-list");
SITE.boards.forEach(b=>{
  const li=document.createElement("li");
  li.innerHTML=`<a href="#" data-name="${b.name}"><span>◇ ${b.name}</span><span class="cnt">今日 <b>${b.today}</b></span></a>`;
  li.querySelector("a").onclick=e=>{e.preventDefault();applyBoard(b.name);window.scrollTo({top:0});};
  bl.appendChild(li);
});
$("#rank").innerHTML = [...SITE.boards].sort((a,b)=>b.today-a.today).map(b=>`<li>${b.name}<span style="margin-left:auto;color:#8a97a8;font-size:12px">${b.today}</span></li>`).join("");

const main=$("#main");
let curBoard=null;

/* ============================================================
   ★ ARG 彩蛋：停留 30 秒自动闪一下屏（刷新会重新计时）
   ============================================================ */
let dwellSec = 0;
const FLASH_AT = 30;          // 秒。想改时间改这里
setInterval(()=>{
  dwellSec++;
  if(dwellSec===FLASH_AT || (dwellSec>FLASH_AT && dwellSec%25===0)) flashScreen();
},1000);
function flashScreen(){
  document.body.classList.remove("flashing");
  void document.body.offsetWidth;   // 重新触发动画
  document.body.classList.add("flashing");
  setTimeout(()=>document.body.classList.remove("flashing"),600);
}

/* 统一的版块切换：导航 + 左侧列表高亮同步 */
function applyBoard(name){
  curBoard=name;
  [...navEl.children].forEach(a=>a.classList.toggle("cur", (name===null&&a.dataset.name==="首页")||a.dataset.name===name));
  [...bl.children].forEach(li=>{
    const a=li.querySelector("a");
    a.classList.toggle("cur", a.dataset.name===name);
  });
  postList(); window.scrollTo({top:0});
}

function postList(){
  const list = curBoard ? SITE.posts.filter(p=>p.board===curBoard) : SITE.posts;
  const empty = list.length ? "" : `<div style="padding:30px;text-align:center;color:#9aa7b8">这个版块还没有帖子，来抢沙发吧。</div>`;
  main.innerHTML = `
    <div class="card">
      <h3>${curBoard?curBoard:"综合 · 最新帖子"} <span class="more">按最后回复排序</span></h3>
      <div class="table-scroll">
      <table class="plist">
        <thead><tr><th>标题</th><th style="width:90px">作者</th><th style="width:50px" class="num">回复</th><th style="width:130px">最后回复</th></tr></thead>
        <tbody>${list.map(p=>{
            const real=SITE.posts.indexOf(p);
            return `<tr><td class="t"><a href="#" data-i="${real}">${p.pin?'<span class="pin">[热门]</span>':''}${p.title}</a></td>
              <td class="author">${p.author}</td><td class="num">${p.replies}</td><td class="last">${p.last}</td></tr>`;
          }).join("")}
        </tbody>
      </table>
      </div>${empty}
    </div>`;
  main.querySelectorAll(".t a").forEach(a=>a.onclick=e=>{e.preventDefault();openPost(+a.dataset.i);});
}

let views = {};
function openPost(i){
  const p=SITE.posts[i];
  views[i]=(views[i]||0)+1;   // 浏览量 +1

  const floors = p.replyList.map((r,idx)=>{
    const floorNo = idx+2;
    const body = r.img ? `<a href="#" class="shot">${r.text}</a>` : r.text;
    return `<div class="reply"><div class="rh"><span class="floor">${floorNo}楼</span><b>${r.who}</b></div><div>${body}</div></div>`;
  }).join("");

  main.innerHTML=`
    <div class="card">
      <h3>帖子详情 <span class="more"><a href="#" id="back">← 返回列表</a></span></h3>
      <div class="post-box">
        <h1>${p.title}</h1>
        <div class="post-meta"><span>作者：${p.author}</span><span>版块：${p.board}</span><span>回复：${p.replies}</span><span>浏览：${views[i]}</span><span>最后：${p.last}</span></div>
        <div class="post-body">${p.body.map(t=>`<p>${t}</p>`).join("")}</div>
        <h3 style="background:none;border:none;padding:6px 0;color:var(--blue-deep)">全部回复（${p.replyList.length}）</h3>
        ${floors}
      </div>
    </div>`;
  $("#back").onclick=e=>{e.preventDefault();postList();};
  main.querySelectorAll("a.shot").forEach(a=>a.onclick=e=>{e.preventDefault();openShot();});
  window.scrollTo({top:0,behavior:"smooth"});
}

/* 截图弹窗 */
function openShot(){
  $("#img-mask-src").src=SITE.screenshot;
  $("#img-cap").textContent=SITE.screenshotCap;
  $("#img-mask").classList.add("show");
}
const imgMask=$("#img-mask");
imgMask.onclick=()=>imgMask.classList.remove("show");

/* 登录/注册 → 404 */
const mask=$("#mask");
$("#btn-login").onclick=e=>{e.preventDefault();mask.classList.add("show");};
$("#btn-reg").onclick=e=>{e.preventDefault();mask.classList.add("show");};
$("#mask-close").onclick=()=>mask.classList.remove("show");
mask.onclick=e=>{if(e.target===mask)mask.classList.remove("show");};

postList();
</script>
