<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>罗江煤矿</title>
<meta name="description" content="罗江煤矿——县属国有地方煤矿，始建于一九五八年。">
<link rel="icon" href="assets/jijia.png">
<style>
/* ══════════════════════════════════════════════════════════════════
   罗江煤矿 · 企业网站
   ------------------------------------------------------------------
   视觉方向：**1999—2003 年那批国企网站**。
   深蓝／灰／红，宋体 12px，表格感边框，标题条，计数器，
   跑马灯公告，闪动 NEW，井架剪影。别加现代圆角和阴影。
   ------------------------------------------------------------------
   ⚠️ 全站所有日期、计数器、"今天是"都是**写死的**，不要改成
      new Date()。这个站停在 2003 年 3 月 21 日，它不该知道今天是几号。
   ⚠️ 改内容只改下面 js 那一块（SITE / NEWS / NOTICE / BROADCAST / ...）。
   ══════════════════════════════════════════════════════════════════ */
:root{
  --navy:#002050;
  --navy-2:#003378;
  --steel:#566884;
  --grey:#c0c4c8;
  --grey-2:#80868c;
  --line:#9aa4b0;
  --line-2:#b9c0c8;
  --bg:#ffffff;
  --amber:#ffd000;
  --red:#c81018;
  --red-2:#8c0810;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#eceff3 url("assets/bg-tile.png") repeat;
  font-family:"SimSun","宋体",serif;font-size:12px;color:#101010;line-height:1.85;
  padding:10px 0 30px;
}
img{border:0;display:block}
a{color:#0033aa;text-decoration:none}
a:hover{color:#c81018;text-decoration:underline}
.px{image-rendering:pixelated}
button{font-family:inherit;font-size:12px;cursor:pointer}

.shell{width:800px;margin:0 auto;background:var(--bg);border:1px solid var(--grey-2)}

/* ── 跑马灯公告 ── */
.ticker{height:22px;overflow:hidden;background:var(--navy);border-bottom:1px solid var(--grey-2);
  display:flex;align-items:center}
.ticker .track{display:block;white-space:nowrap;padding-left:100%;color:var(--amber);font-size:12px;
  animation:roll 26s linear infinite}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* ── 元信息条（今天是／访问计数） ── */
.meta{display:flex;align-items:center;gap:8px;padding:3px 8px;background:#e8ebef;
  border-bottom:1px solid var(--line-2);font-size:12px}
.meta .r{margin-left:auto;display:flex;align-items:center;gap:4px}
.meta .od{display:inline-flex;gap:1px}
.meta .od b{display:block;width:11px;height:15px;line-height:15px;text-align:center;
  background:#101010;color:#33ff66;font-family:Consolas,monospace;font-size:11px;font-weight:400}

/* ── 导航 ── */
.nav{display:flex;background:url("assets/titlebar.png") repeat-x;border-bottom:2px solid var(--navy)}
.nav a{color:#fff;padding:5px 15px;border-right:1px solid var(--steel);font-size:13px;
  text-decoration:none;display:block}
.nav a:hover{background:#0a4a9a;color:#fff;text-decoration:none}
.nav a.on{background:var(--red);color:#fff}

/* ── 两栏 ── */
.cols{display:flex;align-items:stretch;min-height:520px}
.side{width:196px;flex:0 0 196px;border-right:1px solid var(--line-2);padding:8px;background:#f7f8fa}
.main{flex:1;min-width:0;padding:10px 12px}

/* ── 标题框 ── */
.box{border:1px solid var(--line);margin-bottom:10px;background:#fff}
.box>.hd{background:url("assets/titlebar.png") repeat-x;color:#fff;padding:3px 8px;
  border-left:4px solid var(--red);font-size:12px;font-weight:bold;letter-spacing:1px;
  display:flex;align-items:center;gap:6px}
.box>.hd img{width:14px;height:auto}
.box>.bd{padding:7px 9px}

/* 页内主标题（内容区大标题） */
.art-hd{font-size:15px;font-weight:bold;color:var(--navy);text-align:center;
  padding:6px 0 8px;border-bottom:2px solid var(--navy-2);margin-bottom:10px;line-height:1.6}
.art-hd .sub{display:block;font-size:11px;font-weight:normal;color:#555;margin-top:4px}

/* 计划生育标语横幅 */
.slogan{width:100%;border:1px solid var(--line);margin-bottom:10px}

/* ── 列表 ── */
ul.dot{list-style:none}
ul.dot li{padding:3px 0 3px 12px;position:relative;border-bottom:1px dotted #c8ced6}
ul.dot li:last-child{border-bottom:0}
ul.dot li::before{content:"■";position:absolute;left:0;top:3px;color:var(--navy-2);font-size:8px}
ul.dot .dt{color:#666;font-family:Consolas,monospace;font-size:11px;margin-right:4px}
.new{color:var(--red);font-size:10px;font-weight:bold;animation:bl .9s steps(2) infinite}
@keyframes bl{50%{opacity:.15}}

/* 左栏通知公告 */
.notice li{padding:4px 0 4px 12px;font-size:12px;line-height:1.7}
.notice .dt{display:block;color:#777;font-family:Consolas,monospace;font-size:11px;margin-right:0}

/* 友情链接 */
.links li{padding:3px 0 3px 12px}

/* ── 表格 ── */
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th,table.data td{border:1px solid var(--line);padding:3px 6px}
table.data th{background:#dde3ea;font-weight:bold;text-align:center;color:var(--navy)}
table.data td.n{text-align:right;font-family:Consolas,monospace}
table.data td.c{text-align:center}
table.data tr.hl td{background:#fff6d0}
table.data tr.hl td.n{font-weight:bold;color:var(--red)}

/* ── 正文 ── */
.art p{margin-bottom:9px;text-indent:2em;text-align:justify}
.art p.noind{text-indent:0}
.art .sig{text-align:right;text-indent:0;color:#333;margin-top:6px}
.art .dt-line{text-align:center;text-indent:0;color:#555;font-size:11px;margin-bottom:10px;
  border-bottom:1px dotted #c8ced6;padding-bottom:6px}
.back{margin-top:10px;text-indent:0;font-size:12px}

/* ── 概况表 ── */
table.info{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
table.info th{width:96px;background:#dde3ea;border:1px solid var(--line);padding:4px 6px;
  text-align:left;font-weight:bold;color:var(--navy);vertical-align:top}
table.info td{border:1px solid var(--line);padding:4px 8px}

/* ── 广播站 ── */
.radio-hd{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.radio-hd img{width:60px;flex:0 0 60px}
.player{border:1px solid var(--line);background:#f7f8fa;padding:8px;margin-bottom:10px}
.player .row{display:flex;align-items:center;gap:8px}
.player button{border:1px solid var(--grey-2);background:#dfe4ea;padding:3px 12px;color:#101010}
.player button:hover{background:#ced5dd}
.player .st{font-size:11px;color:#555;font-family:Consolas,monospace}
.cast{border:1px solid var(--line-2);margin-bottom:8px}
.cast>.ch{background:#eef1f5;padding:4px 8px;border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:6px;cursor:pointer}
.cast>.ch img{width:16px;height:auto}
.cast>.ch .t{font-weight:bold;color:var(--navy)}
.cast>.ch .dt{margin-left:auto;color:#666;font-family:Consolas,monospace;font-size:11px}
.cast>.cb{padding:7px 9px;display:none}
.cast.open>.cb{display:block}

/* ── 页脚 ── */
.foot{border-top:2px solid var(--navy);background:#eef1f5;padding:8px 10px;text-align:center;
  font-size:11px;color:#555;line-height:2}
.foot .sep{color:var(--line-2)}

@media(max-width:820px){
  .shell{width:auto;margin:0 8px}
  .cols{display:block}
  .side{width:auto;flex:none;border-right:0;border-bottom:1px solid var(--line-2)}
  .nav{flex-wrap:wrap}
  .nav a{padding:5px 10px;font-size:12px}
}
</style>
</head>

  else { key = "home"; body = pageHome(); }

  $("#main").innerHTML = body;
  [].forEach.call($("#nav").querySelectorAll("a"), function(a){
    a.classList.toggle("on", a.getAttribute("data-k") === key);
  });
  window.scrollTo(0, 0);

  /* 广播稿展开 */
  [].forEach.call(document.querySelectorAll(".cast .ch"), function(ch){
    ch.onclick = function(){
      var box = ch.parentNode;
      box.classList.toggle("open");
      NEWS_OPEN["c" + box.dataset.i] = box.classList.contains("open");
    };
  });
  /* 广播信号音 */
  var b = $("#castBtn");
  if(b) b.onclick = function(){
    var on = PA.play();

    $("#castSt").textContent = on ? "正在播放…" : "未播放";
  };
}

/* ══════════ 广播开头信号音（Web Audio 现场合成） ══════════
   不用任何音频文件。老式定压大喇叭那味儿：
   方波 + 低通，三个上行音，前面垫一点电流底噪。 */
var PA = (function(){
  var ctx = null, master = null, noise = null, playing = false, timer = null;
  /* [频率, 起始秒, 时长] —— C5 E5 G5 上行 */
  var NOTES = [[523.25, 0, 0.5], [659.25, 0.42, 0.5], [783.99, 0.84, 0.7]];

  function init(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.0;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1600;
    master.connect(lp); lp.connect(ctx.destination);
    /* 底噪：一小段白噪声循环 */
    var len = Math.floor(ctx.sampleRate * 2);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var ch = buf.getChannelData(0);
    for(var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * 0.035;
    noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    var ng = ctx.createGain(); ng.gain.value = 0.5;
    noise.connect(ng); ng.connect(master);
  }

  function horn(freq, at, dur){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(0.22, at + 0.03);
    g.gain.setValueAtTime(0.22, at + dur - 0.12);
    g.gain.linearRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(master);
    o.start(at); o.stop(at + dur + 0.05);
  }

  function run(){
    var t0 = ctx.currentTime + 0.06;
    noise.start();
    for(var i = 0; i < NOTES.length; i++) horn(NOTES[i][0], t0 + NOTES[i][1], NOTES[i][2]);
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(0.0001, ctx.currentTime);
    master.gain.linearRampToValueAtTime(1.0, ctx.currentTime + 0.05);
    master.gain.setValueAtTime(1.0, t0 + 1.8);
    master.gain.linearRampToValueAtTime(0.0001, t0 + 2.4);
    clearTimeout(timer);
    timer = setTimeout(function(){ stop(true); }, 2600);
  }

  function stop(silent){
    try { noise.stop(); } catch(e){}
    noise = null;
    if(!silent && master){
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
    }
    playing = false;
    var b = document.getElementById("castBtn");
    if(b){ b.textContent = "▶ 播 放 广 播 开 头"; var s = document.getElementById("castSt"); if(s) s.textContent = "未播放"; }
  }

  return {
    play:function(){
      if(!ctx) init();
      if(ctx.state === "suspended") ctx.resume();
      if(playing){ stop(false); return false; }
      /* 每次重放都要重建噪声源（BufferSource 只能 start 一次） */
      if(!noise){
        var len = Math.floor(ctx.sampleRate * 2);
        var buf = ctx.createBuffer(1, len, ctx.sampleRate);
        var ch = buf.getChannelData(0);
        for(var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * 0.035;
        noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
        var ng = ctx.createGain(); ng.gain.value = 0.5;
        noise.connect(ng); ng.connect(master);
      }
      playing = true;
      run();
      return true;
    }
  };
})();
